name: Build Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # UTC 00:00

env:
  REGISTRY_IMAGE: xczh/code-server

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      code_version: ${{ steps.version.outputs.code_version }}
      should_build: ${{ steps.check-image.outputs.should_build }}
    steps:
      - id: version
        run: |
          CODE_VERSION=$(curl -sX GET https://api.github.com/repos/coder/code-server/releases/latest | jq -r '.tag_name' | sed 's|^v||')
          echo "code_version=${CODE_VERSION}" >> "$GITHUB_OUTPUT"
      
      - id: check-image
        run: |
          VER="${{ steps.version.outputs.code_version }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/namespaces/xczh/repositories/code-server/tags/${VER}-full")

          if [ "$HTTP_STATUS" -eq 200 ] && [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Image ${VER}-full already exists in Registry. Skipping build for scheduled run."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Image ${VER}-full does not exist or trigger is manual/push. Proceeding to build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

          
# ==========================================
# AMD64 Pipeline
# ==========================================
  build-slim-amd64:
    needs: get-version
    if: ${{ needs.get-version.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Push Slim (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: slim
          platforms: linux/amd64
          build-args: |
            CODE_VERSION=${{ needs.get-version.outputs.code_version }}
          tags: ${{ env.REGISTRY_IMAGE }}:${{ needs.get-version.outputs.code_version }}-slim-amd64
          push: true
          cache-from: type=gha,scope=slim-amd64
          cache-to: type=gha,mode=max,scope=slim-amd64

  build-full-amd64:
    needs: [get-version, build-slim-amd64]
    if: ${{ needs.get-version.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  
      - name: Build & Push Full (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          platforms: linux/amd64
          build-args: |
            CODE_VERSION=${{ needs.get-version.outputs.code_version }}
          tags: ${{ env.REGISTRY_IMAGE }}:${{ needs.get-version.outputs.code_version }}-full-amd64
          push: true
          cache-from: |
            type=gha,scope=full-amd64
            type=gha,scope=slim-amd64
          cache-to: type=gha,mode=max,scope=full-amd64

# ==========================================
# ARM64 Pipeline
# ==========================================
  build-slim-arm64:
    needs: get-version
    if: ${{ needs.get-version.outputs.should_build == 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Push Slim (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: slim
          platforms: linux/arm64
          build-args: |
            CODE_VERSION=${{ needs.get-version.outputs.code_version }}
          tags: ${{ env.REGISTRY_IMAGE }}:${{ needs.get-version.outputs.code_version }}-slim-arm64
          push: true
          cache-from: type=gha,scope=slim-arm64
          cache-to: type=gha,mode=max,scope=slim-arm64

  build-full-arm64:
    needs: [get-version, build-slim-arm64]
    if: ${{ needs.get-version.outputs.should_build == 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  
      - name: Build & Push Full (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          platforms: linux/arm64
          build-args: |
            CODE_VERSION=${{ needs.get-version.outputs.code_version }}
          tags: ${{ env.REGISTRY_IMAGE }}:${{ needs.get-version.outputs.code_version }}-full-arm64
          push: true
          cache-from: |
            type=gha,scope=full-arm64
            type=gha,scope=slim-arm64
          cache-to: type=gha,mode=max,scope=full-arm64

# ==========================================
# Manifest Merge
# ==========================================
  manifest-slim:
    needs: [get-version, build-slim-amd64, build-slim-arm64]
    if: ${{ needs.get-version.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create & Push Slim Multi-Arch Manifest
        run: |
          VER="${{ needs.get-version.outputs.code_version }}"
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:${VER}-slim \
                                          -t ${{ env.REGISTRY_IMAGE }}:slim \
            ${{ env.REGISTRY_IMAGE }}:${VER}-slim-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${VER}-slim-arm64

  manifest-full:
    needs: [get-version, build-full-amd64, build-full-arm64]
    if: ${{ needs.get-version.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create & Push Full Multi-Arch Manifest
        run: |
          VER="${{ needs.get-version.outputs.code_version }}"
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:${VER}-full \
                                          -t ${{ env.REGISTRY_IMAGE }}:full \
                                          -t ${{ env.REGISTRY_IMAGE }}:latest \
            ${{ env.REGISTRY_IMAGE }}:${VER}-full-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${VER}-full-arm64
